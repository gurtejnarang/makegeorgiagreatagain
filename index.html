      <h1>Make Georgia Great Again</h1>
      <p>A policy vision from USA First Lab for a Georgia that competes with Florida, Texas, and Tennessee.</p>
      <h2>Tax Repeal</h2>
      <p>Repeal Georgia's state income tax and property tax on primary residences and shift to a broad consumption base, the way Florida and Tennessee have.</p>
      <h2>Infrastructure and Airports</h2>
      <p>Build real airports in Savannah, Brunswick, Augusta, and South Georgia so travelers can reach every region without routing through Atlanta.</p>
      <h2>The Georgia Coast</h2>
      <p>Clean and maintain the barrier islands, add public beach access, and develop Tybee, Jekyll, St. Simons, and Sea Island the way Charleston and 30A were developed.</p>
      <h2>South Georgia</h2>
      <p>Build a hunting, agritourism, and outdoor recreation economy across South Georgia.</p>
      <h2>The Chattahoochee River</h2>
      <p>Develop 430 miles of the Chattahoochee from the North Georgia mountains through Atlanta and Columbus to the Gulf.</p>
      <h2>Operation Southern Speed</h2>
      <p>One state office with authority to clear major projects end to end, with permitting, environmental review, workforce, and utilities handled in parallel on a fixed timeline.</p>
